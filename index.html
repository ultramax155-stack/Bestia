const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SUITS=['Denari','Coppe','Spade','Bastoni'],SY=[
 `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#f5c518" stroke="#b07a00" stroke-width="1.5"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#b07a00" stroke-width="1.5"/></svg>`,
 `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 2.5h15c0 7-3.2 10.5-7.5 10.5S4.5 9.5 4.5 2.5z" fill="#d32f2f"/><path d="M11 13h2v6h-2z" fill="#d32f2f"/><path d="M6.5 19.5h11v2.5h-11z" fill="#d32f2f"/></svg>`,
 `<svg viewBox="0 0 24 24" aria-hidden="true"><g stroke="#2c4aa8" stroke-linecap="round" fill="none"><path d="M3.5 3.5L18 18M20.5 3.5L6 18" stroke-width="2.4"/><path d="M12.5 17.5l4.5-4.5M11.5 17.5L7 13" stroke-width="2.4"/><path d="M18 18l2.5 2.5M6 18l-2.5 2.5" stroke-width="3"/></g></svg>`,
 `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20.5L14 10.5" stroke="#1b5e20" stroke-width="3.2" stroke-linecap="round"/><ellipse cx="16.5" cy="7.5" rx="4.2" ry="6.2" transform="rotate(45 16.5 7.5)" fill="#2e7d32"/></svg>`],SC=['#b07a00','#c0392b','#2c4aa8','#2e7d32'];
const POW={1:9,3:8,10:7,9:6,8:5,7:4,6:3,5:2,4:1,2:0};
const su=c=>c/10|0,rk=c=>c%10+1,pw=c=>POW[rk(c)];
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const card=(c,x='',at='')=>{const s=su(c),r=rk(c),l={1:'A',8:'F',9:'C',10:'R'}[r]||r;
 return `<div class="card ${x}" ${at} data-c="${c}" style="--k:${SC[s]}"><b>${l}</b><i>${SY[s]}</i><small>${SUITS[s]}</small></div>`};

/* ================= MOTORE DI GIOCO (puro, usato da locale e host online) ================= */
const E={
 nm:(S,id)=>S.players.find(p=>p.id===id).name,
 actor(S){if(S.phase==='dich'||S.phase==='dott')return S.seq[S.cur];if(S.phase==='gioco')return S.ord[S.trick.length];return null},
 init(players,T,dealerId){const S={players,T,bal:{},carry:0,n:0};players.forEach(p=>S.bal[p.id]=0);
  S.dealer=dealerId==null?Math.random()*players.length|0:players.findIndex(p=>p.id===dealerId);E.deal(S);return S},
 deal(S){const ids=S.players.map(p=>p.id),n=ids.length,d=S.dealer;
  S.deck=shuf([...Array(40).keys()]);S.brisc=S.deck.pop();S.pool=[];S.hands={};S.dec={};S.tricks={};S.trick=[];S.tnum=0;S.cur=0;S.ord=[];S.lastW=null;
  S.seq=ids.map((_,k)=>ids[(d+1+k)%n]);S.seq.forEach(i=>S.hands[i]=S.deck.splice(0,S.T));
  S.pot=S.carry+S.T;S.carry=0;S.bal[ids[d]]-=S.T;S.phase='dich';
  S.msg=`${E.nm(S,ids[d])} dà le carte e versa ${S.T} al piatto. Briscola: ${SUITS[su(S.brisc)]}.`},
 legal(h,tr,bs,tn){
  if(!tr.length){if(tn>0){const t=h.filter(c=>su(c)===bs);if(t.length)return t}else if(h.includes(bs*10))return[bs*10];return h}
  const l=su(tr[0].c),s=h.filter(c=>su(c)===l);if(s.length)return s;
  const t=h.filter(c=>su(c)===bs);return t.length?t:h},
 nd(S){while(S.cur<S.seq.length&&S.dec[S.seq[S.cur]]!=='p')S.cur++;if(S.cur>=S.seq.length)E.start(S)},
 start(S){const pl=S.seq.filter(i=>S.dec[i]==='k'||S.dec[i]==='d');S.cur=0;S.ord=pl;pl.forEach(i=>S.tricks[i]=0);
  if(pl.length<=1){if(pl[0]){S.bal[pl[0]]+=S.pot;S.msg=`${E.nm(S,pl[0])} gioca da solo e vince tutto il piatto (${S.pot}).`}
   else{S.carry=S.pot;S.msg='Nessuno gioca: il piatto passa alla smazzata successiva.'}S.phase='fine';return}
  S.phase='gioco';S.msg=`Inizia ${E.nm(S,pl[0])}.`},
 settle(S){const sh=S.pot/S.T,o=[];
  S.ord.forEach(i=>{const t=S.tricks[i],n=E.nm(S,i);S.bal[i]+=t*sh;
   if(!t){S.bal[i]-=S.pot;S.carry+=S.pot;o.push(`${n} va in BESTIA (−${S.pot})`)}else o.push(`${n}: ${t} prese (+${t*sh})`)});
  S.phase='fine';S.msg=o.join(' · ')+(S.carry?`. Il piatto successivo parte da ${S.carry}.`:'')},
 step(S,a){const r=E.apply(S,a);if(!r)S.n++;return r},
 apply(S,a){const id=a.id,P=S.phase,n=S.seq.length,nm=E.nm.bind(null,S);
  if(a.t==='next'){
   if(P==='dichfine'){S.cur=0;S.phase='dott';E.nd(S)}
   else if(P==='presa'){const w=S.lastW;S.tnum++;
    if(S.tnum>=S.T)E.settle(S);else{const i=S.ord.indexOf(w);S.ord=[...S.ord.slice(i),...S.ord.slice(0,i)];S.trick=[];S.phase='gioco';S.msg=`Tocca a ${nm(w)}.`}}
   else if(P==='fine'){S.dealer=(S.dealer+1)%n;E.deal(S)}else return'x';return}
  if(id!==E.actor(S))return'x';
  if(P==='dich'){
   if(a.t==='k')S.dec[id]='k';
   else if(a.t==='p'){if(S.cur===n-1&&!Object.values(S.dec).includes('k'))return'Sei l\'ultimo: devi bussare';S.dec[id]='p'}else return'x';
   S.msg=`${nm(id)} ${a.t==='k'?'bussa':'passa'}.`;S.cur++;if(S.cur>=n){S.phase='dichfine';S.msg+=' Dichiarazioni concluse.'}return}
  if(P==='dott'){
   if(a.t==='y'){if(S.deck.length+S.pool.length<S.T)return'Carte insufficienti';
    if(S.deck.length<S.T){S.deck=shuf(S.deck.concat(S.pool));S.pool=[]}
    S.hands[id]=S.deck.splice(0,S.T);S.dec[id]='d';S.msg=`${nm(id)} cambia le carte (dottore).`}
   else if(a.t==='n'){S.pool.push(...S.hands[id]);S.hands[id]=[];S.dec[id]='s';S.msg=`${nm(id)} resta fuori.`}else return'x';
   S.cur++;E.nd(S);return}
  if(P==='gioco'&&a.t==='c'){const h=S.hands[id];if(!h.includes(a.v))return'x';
   if(!E.legal(h,S.trick,su(S.brisc),S.tnum).includes(a.v))return'Carta non valida';
   S.hands[id]=h.filter(c=>c!==a.v);S.trick.push({id,c:a.v});
   if(S.trick.length<S.ord.length){S.msg=`${nm(id)} gioca.`;return}
   const bs=su(S.brisc),l=su(S.trick[0].c),tr=S.trick.filter(x=>su(x.c)===bs),cd=tr.length?tr:S.trick.filter(x=>su(x.c)===l);
   const w=cd.reduce((x,y)=>pw(y.c)>pw(x.c)?y:x).id;S.tricks[w]++;S.lastW=w;S.phase='presa';S.msg=`${nm(w)} vince la presa.`;return}
  return'x'},
 pub:S=>({phase:S.phase,players:S.players,dealer:S.players[S.dealer].id,pot:S.pot,carry:S.carry,bal:S.bal,brisc:S.brisc,dec:S.dec,
  actor:E.actor(S),trick:S.trick,tricks:S.tricks,tnum:S.tnum,T:S.T,msg:S.msg,lastW:S.lastW,ord:S.ord,cur:S.cur,pool:S.deck.length+S.pool.length,n:S.n})
};

/* ================= STATO APP ================= */
let scr='home',mode='',L=null,rev=-1,FBOK=false,db,auth,unsub=[],err='';
const G={uid:null,name:localStorage.bn||'',code:'',room:null,hand:[],isHost:false,S:null,done:new Set(),cfg:{T:3,dealer:'r'}};
const LS={names:['','',''],T:3,dealer:'r'};
const maxT=n=>n*4+1<=40?[3,4]:[3];

/* ================= SCHERMATE ================= */
const home=()=>`<h1>🃏 Bestia</h1><div class=box><h2>Come vuoi giocare?</h2>
<div class=row><button class=pri data-a=loc>In locale (un solo dispositivo)</button></div>
<div class=row><button class=pri data-a=onl ${FBOK?'':'disabled'}>Online con una stanza</button></div>
${FBOK?'':'<small class=err>Online non disponibile: configurazione Firebase mancante o connessione assente. La modalità locale funziona.</small>'}</div>
<small>Regole: 40 carte, 3 carte a testa, briscola, obbligo di rispondere al seme e di tagliare. Chi gioca e non fa prese va in bestia.</small>`;
const tSel=(n,v,id)=>`<label>Carte iniziali<select id=${id}>${maxT(n).map(t=>`<option ${t==v?'selected':''}>${t}</option>`).join('')}</select></label>`;
const lsetup=()=>{const n=LS.names.length;return `<h1>Partita locale</h1><div class=box>
${LS.names.map((x,i)=>`<div class=row><span>${i+1}</span><input data-k=n data-i=${i} value="${esc(x)}" placeholder="Giocatore ${i+1}" maxlength=14>
<button data-a=up data-i=${i}>↑</button><button data-a=dn data-i=${i}>↓</button><button data-a=del data-i=${i} ${n<=2?'disabled':''}>✕</button></div>`).join('')}
<div class=row><button data-a=add ${n>=10?'disabled':''}>+ Giocatore</button></div><small>L'ordine è quello dei posti (senso antiorario). Max 10 giocatori.</small>
${tSel(n,LS.T,'T')}
<label>Cartaro (mazziere)<select id=dealer><option value=r>Estrazione casuale</option>${LS.names.map((x,i)=>`<option value=${i} ${LS.dealer==i?'selected':''}>${esc(x||'Giocatore '+(i+1))}</option>`).join('')}</select></label>
<div class=row><button class=pri data-a=startL>Inizia</button><button data-a=home>Indietro</button></div></div>`};
const oentry=()=>`<h1>Online</h1><div class=box>
<div class=row><input id=name placeholder="Il tuo nome" maxlength=14 value="${esc(G.name)}"></div>
<div class=row><button class=pri data-a=create>Crea stanza</button></div>
<div class=row><input id=code placeholder="Codice stanza" maxlength=5 value="${esc((location.hash||'').slice(1).toUpperCase().replace(/[^A-Z]/g,'').slice(0,5))}" style="text-transform:uppercase"><button class=pri data-a=join>Entra</button></div>
<p class=err>${esc(err)}</p><button data-a=home>Indietro</button></div>`;
const lobby=()=>{const r=G.room,h=G.isHost,pl=r.players,link=location.origin+location.pathname+'#'+G.code;
 const wa='https://wa.me/?text='+encodeURIComponent(`Gioca con me a Prediction Game! Entra nella mia stanza (codice ${G.code}): ${link}`);
 return `<h1>Sala d'attesa</h1><div class=box style="text-align:center"><small>Codice stanza</small><div class=code>${G.code}</div>
<a href="${wa}" target=_blank rel=noopener><button class=wa style="width:100%">Condividi invito su WhatsApp</button></a></div>
<div class=box><b>Giocatori (${pl.length}/10)</b>${pl.map((p,i)=>`<div class=row><span style="flex:1">${i+1}. ${esc(p.name)}${p.id===r.host?' 👑':''}${p.id===G.uid?' (tu)':''}</span>
${h?`<button data-a=up data-i=${i}>↑</button><button data-a=dn data-i=${i}>↓</button>`:''}</div>`).join('')}</div>
${h?`<div class=box>${tSel(pl.length,G.cfg.T,'T')}<label>Cartaro<select id=dealer><option value=r>Estrazione casuale</option>${pl.map(p=>`<option value="${p.id}" ${G.cfg.dealer===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
<button class=pri style="width:100%" data-a=startO ${pl.length<2?'disabled':''}>Avvia la partita</button>${pl.length<2?'<small>Servono almeno 2 giocatori.</small>':''}</div>`
 :'<p class=w>In attesa che l\'host avvii la partita…</p>'}<p class=err>${esc(err)}</p><button data-a=leave>Esci</button>`};
const gate=id=>`<div class=gate><h2>Passa il dispositivo a</h2><div class=big>${esc(E.nm(L,id))}</div><button class=pri data-a=reveal>Mostra le carte</button></div>`;
function game(p,hand,me,host){
 const nm=id=>esc((p.players.find(x=>x.id===id)||{}).name||'?'),np=p.players.length,pg=['gioco','presa','fine'].includes(p.phase);
 const st=id=>pg?(p.ord.includes(id)?`prese ${p.tricks[id]||0}`:'fuori'):({k:'bussa',p:p.phase==='dott'?'attende':'passa',d:'dottore',s:'fuori'}[p.dec[id]]||'');
 const forced=p.phase==='dich'&&p.cur===np-1&&!Object.values(p.dec).includes('k'),my=me&&p.actor===me;
 const lg=my&&p.phase==='gioco'?E.legal(hand,p.trick,su(p.brisc),p.tnum):[];
 let a='';
 if(p.phase==='dich')a=my?`<div class=row><button class=pri data-a=do data-t=k>Busso</button><button data-a=do data-t=p ${forced?'disabled':''}>Passo</button></div>${forced?'<small>Sei l\'ultimo e nessuno ha bussato: devi bussare.</small>':''}`:`<p class=w>${nm(p.actor)} sta dichiarando…</p>`;
 else if(p.phase==='dott')a=my?`<div class=row><button class=pri data-a=do data-t=y ${p.pool<p.T?'disabled':''}>Cambia le carte</button><button data-a=do data-t=n>Resta fuori</button></div>${p.pool<p.T?'<small>Carte insufficienti nel mazzo.</small>':''}`:`<p class=w>${nm(p.actor)} decide se cambiare le carte…</p>`;
 else if(p.phase==='gioco')a=my?'<p class=w><b>Tocca a te: scegli una carta</b></p>':`<p class=w>Tocca a ${nm(p.actor)}…</p>`;
 else{const lab={dichfine:'Inizia il gioco',presa:'Continua',fine:'Turno successivo'}[p.phase];
  a=host?`<div class=row><button class=pri data-a=next>${lab}</button></div>`:`<p class=w>In attesa che l'host prema "${lab}"…</p>`}
 return `<div class=top><div>Piatto <b>${p.pot}</b>${p.carry?`<br><small>bestia in corso ${p.carry}</small>`:''}</div><div style="text-align:center">${card(p.brisc,'sm')}<small>Briscola</small></div><div style="text-align:right"><small>Mazziere</small><br><b>${nm(p.dealer)}</b></div></div>
<div class=pl style="margin-top:10px">${p.players.map(x=>`<div class="p ${p.actor===x.id?'on':''}"><b>${esc(x.name)}${x.id===me&&mode==='online'?' (tu)':''}</b>saldo ${p.bal[x.id]>0?'+':''}${p.bal[x.id]}<br><small>${st(x.id)}</small></div>`).join('')}</div>
<div class=table>${p.trick.length?p.trick.map(x=>`<div class=tc>${card(x.c,'sm')}<small>${nm(x.id)}</small></div>`).join(''):'<small style="color:#e6efe8">Il tavolo è vuoto</small>'}</div>
<div class=msg>${esc(p.msg||'')}</div>${a}
<div class=hand>${hand.map(c=>lg.includes(c)?card(c,'','data-a=play'):card(c,my&&p.phase==='gioco'?'dis':'')).join('')}</div>
${mode==='online'?'<button data-a=leave>Esci dalla stanza</button>':'<button data-a=home>Termina partita</button>'}`}
function render(){let h;
 if(scr==='home')h=home();else if(scr==='lsetup')h=lsetup();else if(scr==='oentry')h=oentry();
 else if(scr==='lobby'&&G.room)h=lobby();
 else if(scr==='game'){
  if(mode==='local'){const p=E.pub(L),a=p.actor;if(a&&rev!==L.n)h=gate(a);else h=game(p,a?L.hands[a]:[],a,true)}
  else if(G.room&&G.room.pub)h=game(G.room.pub,G.hand,G.uid,G.isHost);else h='<p class=w>Caricamento…</p>'}
 else h='<p class=w>Caricamento…</p>';
 app.innerHTML=h}

/* ================= ONLINE (Firebase) ================= */
const loadJs=u=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
async function fbInit(){try{if(!FB.apiKey)throw 0;const b='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
 await loadJs(b+'app-compat.js');await Promise.all([loadJs(b+'auth-compat.js'),loadJs(b+'firestore-compat.js')]);
 firebase.initializeApp(FB);auth=firebase.auth();db=firebase.firestore();G.uid=(await auth.signInAnonymously()).user.uid;FBOK=true}catch(e){FBOK=false}}
const R=()=>db.collection('bestia_rooms').doc(G.code),FV=()=>firebase.firestore.FieldValue;
async function create(name){const code=Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
 const ref=db.collection('bestia_rooms').doc(code);if((await ref.get()).exists)return create(name);
 await ref.set({host:G.uid,players:[{id:G.uid,name}],pids:[G.uid],started:false,acts:[],pub:null});enter(code)}
async function join(code,name){const ref=db.collection('bestia_rooms').doc(code),s=await ref.get();if(!s.exists)throw'Stanza non trovata';const d=s.data();
 if(!d.pids.includes(G.uid)){if(d.started)throw'Partita già iniziata: non puoi entrare';if(d.pids.length>=10)throw'Stanza piena (max 10 giocatori)';
  await ref.update({players:FV().arrayUnion({id:G.uid,name}),pids:FV().arrayUnion(G.uid)})}
 enter(code)}
function enter(code){unsub.forEach(f=>f());G.code=code;G.room=null;G.hand=[];G.S=null;G.done=new Set();localStorage.br=code;mode='online';scr='lobby';err='';render();
 unsub=[R().onSnapshot(async s=>{if(!s.exists){leave();return}const d=s.data();G.room=d;G.isHost=d.host===G.uid;
  if(G.isHost&&d.started&&!G.S){const x=await R().collection('priv').doc('state').get();if(x.exists)G.S=JSON.parse(x.data().j)}
  if(G.isHost&&G.S&&d.acts&&d.acts.length){const rem=[];d.acts.forEach(a=>{if(G.done.has(a.k))return;G.done.add(a.k);rem.push(a);
    if(a.t==='next'&&a.id!==G.uid)return;E.step(G.S,a)});if(rem.length)publish(rem)}
  scr=d.started?'game':'lobby';render()},e=>{err='Connessione persa';render()}),
 R().collection('hands').doc(G.uid).onSnapshot(s=>{G.hand=s.exists?s.data().c:[];render()},()=>{})]}
async function publish(rem=[]){const S=G.S,b=db.batch();
 b.update(R(),{pub:E.pub(S),started:true,...(rem.length?{acts:FV().arrayRemove(...rem)}:{})});
 S.players.forEach(p=>b.set(R().collection('hands').doc(p.id),{c:S.hands[p.id]||[]}));
 b.set(R().collection('priv').doc('state'),{j:JSON.stringify(S)});await b.commit()}
function leave(){unsub.forEach(f=>f());unsub=[];delete localStorage.br;G.room=null;mode='';scr='home';render()}

/* ================= AZIONI ================= */
function send(t,v){
 if(mode==='local'){const r=E.step(L,{t,v,id:t==='next'?null:E.actor(L)});if(r&&r.length>1)alert(r);render();return}
 const a={t,v:v??null,id:G.uid};
 if(G.isHost){const r=E.step(G.S,a);if(r&&r.length>1)alert(r);publish()}
 else R().update({acts:FV().arrayUnion({...a,k:Math.random().toString(36).slice(2)})})}
const mv=(arr,i,d)=>{const j=i+d;if(j<0||j>=arr.length)return arr;[arr[i],arr[j]]=[arr[j],arr[i]];return arr};
app.oninput=e=>{const t=e.target;if(t.dataset.k==='n')LS.names[+t.dataset.i]=t.value};
app.onchange=e=>{const t=e.target;
 if(t.id==='T'){(scr==='lsetup'?LS:G.cfg).T=+t.value}
 else if(t.id==='dealer'){(scr==='lsetup'?LS:G.cfg).dealer=t.value}
 else if(t.dataset.k==='n')render()};
app.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i;
 try{
 if(a==='home'){if(mode==='online')leave();mode='';L=null;scr='home';err=''}
 else if(a==='loc'){scr='lsetup'}
 else if(a==='onl'){scr='oentry';err=''}
 else if(a==='add')LS.names.push('');
 else if(a==='del'){LS.names.splice(i,1);LS.dealer='r'}
 else if(a==='up'||a==='dn'){const d=a==='up'?-1:1;
  if(scr==='lsetup'){mv(LS.names,i,d)}else if(G.isHost){const pl=[...G.room.players];mv(pl,i,d);await R().update({players:pl});return}}
 else if(a==='startL'){if(LS.T==4&&LS.names.length>9)LS.T=3;
  const pl=LS.names.map((x,k)=>({id:'p'+k,name:x.trim()||'Giocatore '+(k+1)}));
  L=E.init(pl,LS.T,LS.dealer==='r'?null:'p'+LS.dealer);mode='local';rev=-1;scr='game'}
 else if(a==='reveal')rev=L.n;
 else if(a==='create'||a==='join'){const nm=$('#name').value.trim(),cd=$('#code').value.trim().toUpperCase();
  if(!nm){err='Inserisci il tuo nome';render();return}G.name=nm;localStorage.bn=nm;err='';
  if(a==='create')await create(nm);else{if(cd.length!==5){err='Il codice ha 5 lettere';render();return}await join(cd,nm)}return}
 else if(a==='startO'){if(G.room.players.length<2)return;const pl=G.room.players,T=maxT(pl.length).includes(+G.cfg.T)?+G.cfg.T:3;
  G.S=E.init(pl,T,G.cfg.dealer==='r'||!pl.some(p=>p.id===G.cfg.dealer)?null:G.cfg.dealer);await publish();return}
 else if(a==='leave')return leave();
 else if(a==='do')return send(b.dataset.t);
 else if(a==='play')return send('c',+b.dataset.c);
 else if(a==='next')return send('next');
 }catch(x){err=String(x);if(scr==='lobby')mode='online'}
 render()};
window.addEventListener('hashchange',()=>{if(scr==='oentry')render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
fbInit().then(async()=>{render();if(FBOK&&localStorage.br&&G.name){try{await join(localStorage.br,G.name)}catch(e){delete localStorage.br}}
 if(FBOK&&!localStorage.br&&/^#[A-Za-z]{5}$/.test(location.hash)&&scr==='home'){scr='oentry';render()}});
</script></body></html>
